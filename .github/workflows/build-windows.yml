name: Build Windows (Visual Studio)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore NuGet packages (if any)
      run: nuget restore CheckpointPlugin.sln
      continue-on-error: true

    - name: Build solution (Release x64)
      run: msbuild CheckpointPlugin.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Find built DLL
      shell: powershell
      run: |
        $dll = Get-ChildItem -Path . -Recurse -Filter "*CheckpointPlugin*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($null -eq $dll) {
          Write-Error "DLL não encontrada após build."
          exit 1
        } else {
          Write-Host "DLL encontrada em: $($dll.FullName)"
        }

    - name: Upload DLL artifact
      uses: actions/upload-artifact@v4
      with:
        name: checkpointplugin-dll
        path: '**/*CheckpointPlugin*.dll'
